<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>편지 쓰기 | HANDDIMI</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat&family=Gochi+Hand&family=Indie+Flower&family=Patrick+Hand&display=swap">
</head>
<body>
  <main class="page wide-page">
    <header class="header">
      <h1 class="title">편지 쓰기</h1>
      <div class="header-buttons">
        <a class="btn btn-mid" href="./font.html">전체 보기</a>
        <button class="btn btn-primary btn-download" id="btn-download" type="button" disabled>이미지 다운로드</button>
      </div>
    </header>
    <div class="letter-layout">
      <section class="letter-controls" aria-label="편지 설정">
        <label class="field" for="font-select">사용할 폰트
          <select id="font-select"><option>나의 첫 손글씨</option></select>
        </label>
        <fieldset class="paper-options">
          <legend>편지지</legend>
          <div class="paper-choices" role="radiogroup" aria-label="편지지">
            <button class="paper-option selected" type="button" data-paper="lined" role="radio" aria-checked="true"><span></span>줄노트</button>
            <button class="paper-option" type="button" data-paper="blank" role="radio" aria-checked="false"><span></span>무지</button>
            <button class="paper-option" type="button" data-paper="grid" role="radio" aria-checked="false"><span></span>격자</button>
          </div>
        </fieldset>
        <label class="field" for="letter-text">편지 내용
          <small id="letter-help">입력 가능: A–Z</small>
          <textarea id="letter-text" aria-describedby="letter-help" spellcheck="false">DEAR YOU,


THANK YOU FOR EVERYTHING.


FROM ME</textarea>
        </label>
        <p id="letter-status" role="status"></p>
      </section>
      <figure class="letter-preview">
        <figcaption>미리보기</figcaption>
        <div id="preview"></div>
      </figure>
    </div>
  </main>
  <!-- letter.js 초기화에 필요한 기존 미리보기 요소 -->
  <div hidden>
    <button id="btn-fullview" type="button">편지 전체 보기</button>
    <div id="modal" hidden>
      <button id="modal-close" type="button">닫기</button>
      <img id="modal-img" alt="작성한 편지">
    </div>
  </div>

  <script type="module" src="./js/letter-page.js"></script>
</body>
</html>
