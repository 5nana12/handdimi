<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HANDDIMI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      color: #222;
      background: #fff;
    }

    .page {
      width: 1120px;
      margin: 80px auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .header-buttons {
      display: flex;
      gap: 12px;
    }

    .info {
      display: flex;
      align-items: center;
      margin: 28px 0 20px;
    }

    .info-label {
      font-size: 14px;
      margin-right: 36px;
    }

    .current-letter {
      font-size: 44px;
      font-weight: 700;
    }

    .progress {
      margin-left: auto;
      margin-right: 84px;
      font-size: 20px;
    }

    #canvas-box {
      border: 1px solid #ccc;
      line-height: 0;
    }

    #canvas-box canvas {
      cursor: crosshair;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
    }

    .footer-left,
    .footer-right {
      display: flex;
      gap: 12px;
    }

    .btn {
      height: 48px;
      padding: 0 24px;
      border: 1px solid #ccc;
      background: #fff;
      color: #222;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
    }

    .btn:hover { background: #f5f5f5; }

    .btn:disabled {
      color: #bbb;
      border-color: #eee;
      cursor: default;
      background: #fff;
    }

    .btn-wide { width: 168px; }
    .btn-mid { width: 148px; }

    .btn-primary {
      width: 160px;
      background: #222;
      border-color: #222;
      color: #fff;
    }

    .btn-primary:hover { background: #000; }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <h1 class="title">나의 첫 손글씨</h1>
      <div class="header-buttons">
        <button class="btn btn-wide" id="btn-my-fonts">내 폰트 목록</button>
        <button class="btn btn-wide" id="btn-overview">전체 보기 →</button>
      </div>
    </header>

    <section class="info">
      <span class="info-label">지금 그릴 글자</span>
      <span class="current-letter" id="current-letter">A</span>
      <span class="progress" id="progress">1 / 26</span>
    </section>

    <div id="canvas-box"></div>

    <footer class="footer">
      <div class="footer-left">
        <button class="btn" id="btn-undo">되돌리기</button>
        <button class="btn" id="btn-clear">지우기</button>
      </div>
      <div class="footer-right">
        <button class="btn btn-mid" id="btn-prev">이전 글자</button>
        <button class="btn btn-primary" id="btn-next">다음 글자</button>
      </div>
    </footer>
  </main>

  <script type="module" src="./js/main.js"></script>
  <script type="module" src="./js/draw.js"></script>
</body>
</html>
