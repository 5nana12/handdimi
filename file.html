<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 폰트 목록 | HANDDIMI</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="page library-page">
    <header class="header">
      <h1 class="title">내 폰트 목록</h1>
      <button class="btn btn-primary" id="new-font" type="button" disabled>새로 만들기</button>
    </header>
    <p id="library-status" role="status"></p>
    <div class="library-empty" id="empty-library" hidden>
      <h2>아직 폰트가 없어요</h2>
      <p>첫 폰트를 만들어 보세요</p>
    </div>
    <div class="library-table" id="font-library" hidden>
      <table>
        <thead>
          <tr><th scope="col">폰트 이름</th><th scope="col">진행도</th><th scope="col">마지막 수정일</th><th scope="col"><span class="sr-only">작업</span></th></tr>
        </thead>
        <tbody id="font-rows"></tbody>
      </table>
    </div>
  </main>

  <dialog class="dialog" id="new-font-dialog" aria-labelledby="new-font-title">
    <form id="new-font-form">
      <h2 id="new-font-title">새 폰트 만들기</h2>
      <label class="field" for="new-font-name">폰트 이름
        <input id="new-font-name" value="나의 새 손글씨" required maxlength="80" autofocus>
      </label>
      <p id="new-font-status" role="status"></p>
      <div class="button-row">
        <button class="btn" id="cancel-new-font" type="button">취소</button>
        <button class="btn btn-primary" type="submit">그리기 시작하기</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./js/file-page.js"></script>
</body>
</html>
